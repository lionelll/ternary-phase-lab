name: Deploy release to Alibaba Cloud production

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: ternary-phase-lab-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-build-deploy:
    if: github.ref == 'refs/heads/release'
    name: Test, build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://ternary.changyanedu.cn/
    env:
      DEPLOY_ROOT: /data/wwwroot/ternary.changyanedu.cn
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run phase-geometry tests
        run: npm run test:phase

      - name: Build static production package
        env:
          TERNARY_BASE_PATH: /
        run: npm run build:static

      - name: Write deployment metadata
        run: |
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"version":"release","commit":"%s","deployedAt":"%s","environment":"production"}\n' \
            "$GITHUB_SHA" "$deployed_at" > static-dist/release.json
          printf '%s\n' "$GITHUB_SHA" > static-dist/REVISION

      - name: Prepare deployment archive
        run: tar -C static-dist -czf "/tmp/ternary-prod-${GITHUB_SHA}.tgz" .

      - name: Install password login support
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Configure pinned password SSH access
        env:
          PROD_SSH_PASSWORD: ${{ secrets.PROD_SSH_PASSWORD }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PROD_SSH_HOST"
          test -n "$PROD_SSH_PORT"
          test -n "$PROD_SSH_USER"
          test -n "$PROD_SSH_PASSWORD"
          test -n "$PROD_SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload immutable release
        env:
          SSHPASS: ${{ secrets.PROD_SSH_PASSWORD }}
        run: |
          sshpass -e scp \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -P "$PROD_SSH_PORT" \
            "/tmp/ternary-prod-${GITHUB_SHA}.tgz" \
            scripts/deploy-production.sh \
            "$PROD_SSH_USER@$PROD_SSH_HOST:/tmp/"

      - name: Activate and verify release
        env:
          SSHPASS: ${{ secrets.PROD_SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "$PROD_SSH_PORT" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "DEPLOY_ROOT='$DEPLOY_ROOT' bash /tmp/deploy-production.sh '/tmp/ternary-prod-${GITHUB_SHA}.tgz' '$GITHUB_SHA'"

      - name: Verify public production URL
        run: |
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 2 \
            "https://ternary.changyanedu.cn/release.json" \
            | grep --fixed-strings "\"commit\":\"$GITHUB_SHA\""
